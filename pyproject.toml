[project]
name = "curve-hook"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "pytest>=9.1.1",
    "titanoboa==0.2.8",
    "vyper==0.4.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    # boa casts every clone the factory creates to the implementation it forwards to
    "ignore:casted bytecode does not match compiled bytecode",
]
